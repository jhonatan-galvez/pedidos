<title>Doña Flori | Iniciar sesión</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
    href="{{ url_for('static', filename='css/admin.css') }}">

<style>

    /* ================================
       LOGIN
    ================================= */

    * {
        box-sizing: border-box;
    }

    body.login-page {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;
        overflow: hidden;

        background:
            radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.25), transparent 30%),
            radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.18), transparent 30%),
            linear-gradient(135deg, #0f172a 0%, #172554 55%, #1e3a8a 100%);
    }


    /* ================================
       DECORACIÓN DE FONDO
    ================================= */

    .login-bg-circle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(2px);
    }

    .login-bg-circle.one {
        width: 420px;
        height: 420px;

        top: -180px;
        left: -160px;

        background: rgba(59, 130, 246, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .login-bg-circle.two {
        width: 520px;
        height: 520px;

        right: -250px;
        bottom: -260px;

        background: rgba(37, 99, 235, 0.10);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }


    /* ================================
       CONTENEDOR
    ================================= */

    .login-wrapper {
        width: 100%;
        max-width: 430px;

        padding: 25px;

        position: relative;
        z-index: 2;
    }


    /* ================================
       TARJETA
    ================================= */

    .login-box {
        background: rgba(255, 255, 255, 0.97);

        border: 1px solid rgba(255, 255, 255, 0.5);

        border-radius: 22px;

        padding: 42px;

        box-shadow:
            0 25px 60px rgba(0, 0, 0, 0.28),
            0 8px 20px rgba(0, 0, 0, 0.10);

        backdrop-filter: blur(12px);
    }


    /* ================================
       LOGO
    ================================= */

    .login-logo {
        display: flex;
        justify-content: center;

        margin-bottom: 20px;
    }

    .login-logo img {
        width: 86px;
        height: 86px;

        object-fit: cover;

        border-radius: 50%;

        background: #fff;

        padding: 4px;

        box-shadow:
            0 8px 20px rgba(15, 23, 42, 0.16);

        border: 1px solid #e2e8f0;
    }


    /* ================================
       TITULO
    ================================= */

    .login-title {
        text-align: center;
        margin-bottom: 6px;
    }

    .login-title h1 {
        margin: 0;

        font-size: 25px;
        font-weight: 700;

        color: #0f172a;

        letter-spacing: -0.4px;
    }

    .login-title p {
        margin: 7px 0 0;

        color: #64748b;

        font-size: 14px;
    }


    /* ================================
       SEPARADOR
    ================================= */

    .login-divider {
        height: 1px;

        background: #e2e8f0;

        margin: 28px 0;
    }


    /* ================================
       FORMULARIO
    ================================= */

    .login-form-group {
        margin-bottom: 19px;
    }

    .login-form-group label {
        display: block;

        margin-bottom: 7px;

        font-size: 13px;

        font-weight: 600;

        color: #334155;
    }


    /* ================================
       INPUT CON ICONO
    ================================= */

    .login-input-wrapper {
        position: relative;
    }

    .login-input-wrapper i {
        position: absolute;

        left: 14px;
        top: 50%;

        transform: translateY(-50%);

        color: #94a3b8;

        font-size: 14px;

        pointer-events: none;
    }

    .login-input {
        width: 100%;

        height: 46px;

        padding: 0 14px 0 42px;

        border: 1px solid #dbe2ea;

        border-radius: 10px;

        background: #f8fafc;

        color: #0f172a;

        font-family: "Inter", sans-serif;

        font-size: 14px;

        outline: none;

        transition: all 0.2s ease;
    }

    .login-input:hover {
        border-color: #cbd5e1;
    }

    .login-input:focus {
        background: #fff;

        border-color: #2563eb;

        box-shadow:
            0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    /* ================================
       ERROR
    ================================= */

    .login-error {
        display: flex;

        align-items: flex-start;

        gap: 10px;

        background: #fef2f2;

        color: #b91c1c;

        border: 1px solid #fecaca;

        padding: 11px 13px;

        border-radius: 10px;

        margin-bottom: 20px;

        font-size: 13px;

        line-height: 1.4;
    }

    .login-error i {
        margin-top: 2px;
    }


    /* ================================
       BOTÓN
    ================================= */

    .login-button {
        width: 100%;

        height: 47px;

        border: none;

        border-radius: 10px;

        background: linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

        color: white;

        font-family: "Inter", sans-serif;

        font-size: 14px;

        font-weight: 600;

        cursor: pointer;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 9px;

        box-shadow:
            0 6px 14px rgba(37, 99, 235, 0.25);

        transition: all 0.2s ease;
    }

    .login-button:hover {
        transform: translateY(-1px);

        box-shadow:
            0 9px 20px rgba(37, 99, 235, 0.32);

        background: linear-gradient(
            135deg,
            #1d4ed8,
            #1e40af
        );
    }

    .login-button:active {
        transform: translateY(0);
    }


    /* ================================
       RECUPERAR CONTRASEÑA
    ================================= */

    .login-links {
        text-align: center;

        margin-top: 22px;
    }

    .login-links a {
        color: #2563eb;

        text-decoration: none;

        font-size: 13px;

        font-weight: 500;

        transition: 0.2s;
    }

    .login-links a:hover {
        color: #1d4ed8;

        text-decoration: underline;
    }


    /* ================================
       FOOTER
    ================================= */

    .login-security {
        display: flex;

        justify-content: center;

        align-items: center;

        gap: 6px;

        margin-top: 27px;

        color: #94a3b8;

        font-size: 11px;
    }

    .login-security i {
        font-size: 10px;
    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 500px) {

        .login-wrapper {
            padding: 18px;
        }

        .login-box {
            padding: 32px 25px;

            border-radius: 18px;
        }

        .login-logo img {
            width: 76px;
            height: 76px;
        }

        .login-title h1 {
            font-size: 23px;
        }

    }

</style>
```

</head>

<body class="login-page">

```
<!-- Decoración -->
<div class="login-bg-circle one"></div>
<div class="login-bg-circle two"></div>


<div class="login-wrapper">

    <div class="login-box">


        <!-- LOGO -->
        <div class="login-logo">

            <img
                src="{{ url_for('static', filename='img/logo.png') }}"
                alt="Doña Flori">

        </div>


        <!-- TITULO -->
        <div class="login-title">

            <h1>DOÑA FLORI</h1>

            <p>Panel de administración</p>

        </div>


        <div class="login-divider"></div>


        <!-- ERROR -->
        {% if error %}

        <div class="login-error">

            <i class="fa-solid fa-circle-exclamation"></i>

            <span>{{ error }}</span>

        </div>

        {% endif %}


        <!-- FORMULARIO -->
        <form method="POST">


            <!-- USUARIO -->
            <div class="login-form-group">

                <label for="usuario">
                    Usuario
                </label>

                <div class="login-input-wrapper">

                    <i class="fa-regular fa-user"></i>

                    <input
                        id="usuario"
                        type="text"
                        name="usuario"
                        class="login-input"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                        autofocus>

                </div>

            </div>


            <!-- CONTRASEÑA -->
            <div class="login-form-group">

                <label for="password">
                    Contraseña
                </label>

                <div class="login-input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        class="login-input"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required>

                </div>

            </div>


            <!-- BOTÓN -->
            <button
                type="submit"
                class="login-button">

                <i class="fa-solid fa-right-to-bracket"></i>

                Ingresar

            </button>


        </form>


        <!-- RECUPERACIÓN -->
        <div class="login-links">

            <a href="{{ url_for('recuperar_password') }}">

                ¿Olvidaste tu contraseña?

            </a>

        </div>


        <!-- SEGURIDAD -->
        <div class="login-security">

            <i class="fa-solid fa-shield-halved"></i>

            Acceso seguro al panel administrativo

        </div>


    </div>

</div>
```
