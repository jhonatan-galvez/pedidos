<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doña Flori | Tienda Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="header">

    <div class="container nav">

        <div class="logo">

            <img
                src="{{ url_for('static', filename='img/logo.png') }}"
                class="logo-img"
                alt="Doña Flori">

            <div class="logo-text">

                <strong>DOÑA FLORI</strong>

                <span>Productos de limpieza para el hogar</span>

            </div>

        </div>

        <nav>

            <a href="/">Inicio</a>

            <a href="/catalogo">Catálogo</a>

        </nav>

    </div>

</header>


<section class="home-banners">

    <div class="container"></div>
        <div class="banner-slider">
            <div class="banner-track" id="bannerTrack"></div>
        </div>

        <div class="home-buttons">

            <a href="/catalogo" class="btn-primary">

                Ver catálogo

            </a>

            <a
                href="https://wa.me/51959210913?text=Hola%20Do%C3%B1a%20Flori,%20vi%20su%20cat%C3%A1logo%20y%20quisiera%20hacer%20una%20consulta."
                class="btn-primary">

                💬 Contactar

            </a>

        </div>

    </div>

</section>

<script>
    const banners = [

        {% for banner in banners %}

        "{{ url_for('static', filename='img/banners/' + banner) }}",

        {% endfor %}

    ];


    const track = document.getElementById("bannerTrack");
    const slider = document.querySelector(".banner-slider");


    banners.forEach((banner)=>{

        const div = document.createElement("div");

        div.className = "banner-panel";


        const img = document.createElement("img");

        img.src = banner;

        img.className = "home-banner";


        div.appendChild(img);

        track.appendChild(div);

    });


    let posicion = 0;


    if(banners.length > 1){

        setInterval(()=>{

            posicion++;


            if(posicion >= banners.length){

                posicion = 0;

            }


            const panel = slider.querySelector(".banner-panel");
            const estilos = window.getComputedStyle(track);
            const gap = parseInt(estilos.columnGap || estilos.gap) || 0;

            slider.scrollTo({

                left: (panel.offsetWidth + gap) * posicion,

                behavior:"smooth"

            });


        },4000);

    }

</script>

</body>
</html>
